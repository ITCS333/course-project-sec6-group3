<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin Panel</title>
    <script src="manage_users.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Header */
        
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
        
        header h1 {
            font-size: 1.8rem;
        }
        /* Main content */
        
        main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        /* Sections */
        
        section {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        section h2 {
            color: #2a5298;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        /* Forms */
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        
        input,
        select {
            width: 100%;
            max-width: 400px;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        button {
            padding: 0.6rem 1.2rem;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        button:hover {
            background: #1e3c72;
        }
        /* Details */
        
        details {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        summary {
            cursor: pointer;
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 1rem;
        }
        /* Search */
        
        .search-box {
            margin-bottom: 1rem;
        }
        
        .search-box input {
            max-width: 300px;
        }
        /* Table */
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        th,
        td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #2a5298;
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
            margin-right: 0.5rem;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        
        .badge-admin {
            background: #2a5298;
            color: white;
        }
        
        .badge-student {
            background: #28a745;
            color: white;
        }
        
        .message {
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header with H1 -->
        <header>
            <h1>User Management Dashboard</h1>
        </header>

        <main>
            <!-- Section 1: Change Password -->
            <section>
                <h2>Change Your Password</h2>

                <!-- Password Form -->
                <form id="password-form">
                    <fieldset>
                        <legend>Password Change</legend>

                        <div class="form-group">
                            <label for="current-password">Current Password</label>
                            <input type="password" id="current-password" required>
                        </div>

                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password" required minlength="8">
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" required>
                        </div>

                        <button type="submit" id="change">Change Password</button>
                    </fieldset>
                </form>
            </section>

            <!-- Section 2: User Management -->
            <section>
                <h2>User Management</h2>

                <!-- Add User Form inside Details -->
                <details>
                    <summary>Add New User</summary>

                    <form id="add-user-form">
                        <fieldset>
                            <legend>New User Details</legend>

                            <div class="form-group">
                                <label for="user-name">Full Name</label>
                                <input type="text" id="user-name" required>
                            </div>

                            <div class="form-group">
                                <label for="user-email">Email Address</label>
                                <input type="email" id="user-email" required>
                            </div>

                            <div class="form-group">
                                <label for="default-password">Default Password</label>
                                <input type="password" id="default-password" required minlength="8">
                            </div>

                            <div class="form-group">
                                <label for="is-admin">User Role</label>
                                <select id="is-admin">
                                    <option value="0">Student</option>
                                    <option value="1">Administrator</option>
                                </select>
                            </div>

                            <button type="submit" id="add">Add User</button>
                        </fieldset>
                    </form>
                </details>

                <!-- Search Box -->
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search users by name or email...">
                </div>

                <!-- Users Table -->
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- Users will be loaded here dynamically by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>

        <div id="message-container" class="message"></div>
    </div>
</body>

</html>
