<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            margin: 1rem;
        }
        
        .login-container h1 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 0.5rem;
        }
        
        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-login:hover {
            background: #1e3c72;
        }
        
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #2a5298;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .demo-credentials {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        
        .demo-credentials p {
            margin: 0.25rem 0;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="login-container">

        <p class="subtitle">Sign in to access course materials</p>

        <form id="login-form" method="post">

            <fieldset>
                <legend>Login Information</legend>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email" required placeholder="e.g., student@uob.edu.bh">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" required placeholder="Enter your password" minlength="8">
                </div>

                <button type="submit" id="login" class="btn-login">Login</button>
            </fieldset>
        </form>

        <div id="message-container" class="message"></div>

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong>
            <p>Admin: admin@uob.edu.bh / password</p>
            <p>Student: 202101234@stu.uob.edu.bh / password</p>
        </div>

        <a href="../../index.html" class="back-link">← Back to Home</a>
    </div>

    <script src="login.js" defer></script>
</body>

</html>
